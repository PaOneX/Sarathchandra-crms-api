server.port=${PORT:8081}
spring.application.name=car-rental

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.admin.enabled=${ADMIN_SEED_ENABLED:false}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:System Admin}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

google.client-id=${GOOGLE_CLIENT_ID}

supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.cars=car-images
supabase.storage.avatars=avatars

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

whatsapp.api-url=${WHATSAPP_API_URL:https://graph.facebook.com/v19.0}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.advance-percent=${WHATSAPP_ADVANCE_PERCENT:30}

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=${STRIPE_SUCCESS_URL:}
stripe.cancel-url=${STRIPE_CANCEL_URL:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
