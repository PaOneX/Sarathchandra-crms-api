# ─── Server ───────────────────────────────────────────────
server.port=8080
spring.application.name=car-rental

# ─── DataSource ───────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/car_rental_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── Connection Pool ──────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ─── Flyway ───────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ─── JWT ──────────────────────────────────────────────────
jwt.secret=dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdG9rZW4gZ2VuZXJhdGlvbg==
jwt.expiration=86400000

# ─── Google OAuth ─────────────────────────────────────────
google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com}

# ─── Supabase Storage ─────────────────────────────────────
supabase.url=${SUPABASE_URL:https://your-project.supabase.co}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.cars=car-images
supabase.storage.avatars=avatars

# ─── Multipart uploads ────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# ─── Logging ──────────────────────────────────────────────
logging.level.com.icet.carrental=DEBUG
logging.level.org.springframework.jdbc=DEBUG
